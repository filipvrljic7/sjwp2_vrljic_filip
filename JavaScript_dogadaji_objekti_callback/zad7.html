<!DOCTYPE html>
<html>
<head>
    <title>Pogodi broj</title>
</head>
<body>

    <h1>Pogodi broj od 1 do 100</h1>

    <input type="number" id="broj" placeholder="Unesi broj">

    <button id="provjeri">Provjeri</button>
    <button id="nova">Nova igra</button>

    <p id="poruka"></p>
    <p id="pokusaji">Broj pokušaja: 0</p>

    <script>

        let zamisljeniBroj = Math.floor(Math.random() * 100) + 1;
        let brojPokusaja = 0;
        let gotovo = false;

        const unos = document.getElementById("broj");
        const poruka = document.getElementById("poruka");
        const pokusaji = document.getElementById("pokusaji");

        function provjeriBroj() {

            if (gotovo || unos.value === "") {
                return;
            }

            let broj = Number(unos.value);

            brojPokusaja++;
            pokusaji.textContent = "Broj pokušaja: " + brojPokusaja;

            if (broj < zamisljeniBroj) {
                poruka.textContent = "Zamišljeni broj je veći!";
            } else if (broj > zamisljeniBroj) {
                poruka.textContent = "Zamišljeni broj je manji!";
            } else {
                poruka.textContent = "Bravo! Pogodio si broj!";
                gotovo = true;
            }
        }

        document.getElementById("provjeri").addEventListener("click", provjeriBroj);

        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                provjeriBroj();
            }
        });

        document.getElementById("nova").addEventListener("click", function() {
            zamisljeniBroj = Math.floor(Math.random() * 100) + 1;
            brojPokusaja = 0;
            gotovo = false;

            unos.value = "";
            poruka.textContent = "";
            pokusaji.textContent = "Broj pokušaja: 0";
        });

    </script>

</body>
</html>
