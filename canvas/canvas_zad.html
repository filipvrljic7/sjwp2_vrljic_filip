<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <canvas id="mycanvas" width="600" height="600" style="border: 1px solid black"></canvas>
    <script>
        let c = document.getElementById("mycanvas");
        let ctx = c.getContext("2d");

        //pravokutnik
        ctx.beginPath();
        ctx.rect(50, 150, 300, 200);
        ctx.fillStyle = "blue";
        ctx.fill();

         //pravokutnik
        ctx.beginPath();
        ctx.rect(190, 220, 120, 50);
        ctx.fillStyle ="white";
        ctx.fill();

         //pravokutnik
        ctx.beginPath();
        ctx.rect(100, 250, 50, 120);
        ctx.fillStyle = "white";
        ctx.fill();

        //trokut
        ctx.beginPath();
        ctx.moveTo(50,150);
        ctx.lineTo(100,50);
        ctx.lineTo(300,50);
        ctx.lineTo(50,150);
        ctx.stroke();
        ctx.fillStyle = "red";
        </script>
</body>
</html>
